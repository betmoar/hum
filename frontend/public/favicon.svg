<?xml version="1.0" encoding="UTF-8"?>
<!--
  Hum favicon — three-ring mark with the outermost ring dropped per the brand
  guide ("At 16–32px (favicon), drop the outermost ring. It vanishes anyway.")

  Geometry is brand-locked: radii 44 / 22 / 3 (center dot), strokes 4.5 / 5,
  opacities 0.55 / 1.0. Two variants — light system uses coral on warm-white;
  dark system swaps to warm-white rings on charcoal. Same mark, opposite
  contrast pair.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -50 100 100">
  <style>
    .bg   { fill: #F5F1EA; }
    .mark { stroke: #E26B5C; fill: #E26B5C; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #1A1A1A; }
      .mark { stroke: #F0E6D2; fill: #F0E6D2; }
    }
  </style>
  <rect class="bg" x="-50" y="-50" width="100" height="100" rx="18" />
  <g class="mark" fill="none">
    <circle cx="0" cy="0" r="44" stroke-width="4.5" opacity="0.55" />
    <circle cx="0" cy="0" r="22" stroke-width="5"   opacity="1" />
  </g>
  <circle class="mark" cx="0" cy="0" r="3" stroke="none" />
</svg>
