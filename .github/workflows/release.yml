name: Release

on:
  push:
    tags: ["v*"]

# Needed for `gh release create` to publish a GitHub Release.
permissions:
  contents: write

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # --- Re-run the gate on the tagged commit before publishing ---
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install backend deps (locked)
        run: uv sync --extra dev --python 3.12

      - name: Backend checks
        run: |
          uv run ruff check .
          uv run mypy app/ --strict
          uv run pytest -q

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend checks + build
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      # --- Package the built frontend as a release asset ---
      - name: Package frontend build
        run: tar -czf frontend-dist-${{ github.ref_name }}.tar.gz -C frontend dist

      # --- Extract this version's section from the changelog for notes ---
      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            /^## \[/ && flag { flag=0 }
            flag { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release ${GITHUB_REF_NAME}." > release_notes.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release_notes.md \
            "frontend-dist-${GITHUB_REF_NAME}.tar.gz"
